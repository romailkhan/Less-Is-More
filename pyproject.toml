[project]
name = "cortex"
version = "0.1.0"
description = "Multi-agent orchestration benchmarks (LangChain / OpenRouter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "datasets>=2.19.0",
    "sacrebleu>=2.4.0",
    "langchain>=0.3.21",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.20",
    "langchain-openai>=0.3.11",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "chromadb>=0.5.23",
]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.uv]
package = false
